name: Release

# 仅当 main 分支被推送时触发（版本分支合并/推送后）。
# 工作流不会因 workflow 自身推送的 tag 再次触发，因为 filters 只看 branches。
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted

    # 自托管 runner 上必须预先放置游戏/BepInEx 引用 DLL，通过 secrets 传入绝对路径：
    #   GAME_MANAGED  -> 游戏 Managed 目录（Assembly-CSharp.dll、HumanAPI.dll、UnityEngine*.dll 等）
    #   BEPINEX_CORE  -> BepInEx core 目录（BepInEx.dll、BepInEx.Harmony.dll、0Harmony.dll）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/HSRTimer/HSRTimer.csproj | head -n1 | tr -d '[:space:]')"
          PLUGIN_VERSION="$(sed -n 's/.*PLUGIN_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/HSRTimer/PluginInfo.cs | head -n1 | tr -d '[:space:]')"

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to read <Version> from src/HSRTimer/HSRTimer.csproj"
            exit 1
          fi

          if [ -z "$PLUGIN_VERSION" ]; then
            echo "::error::Unable to read PLUGIN_VERSION from src/HSRTimer/PluginInfo.cs"
            exit 1
          fi

          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch: csproj=$VERSION, PluginInfo=$PLUGIN_VERSION"
            exit 1
          fi

          # main 分支上不应再出现 dev 占位版本（0.0.0）。
          if [ "$VERSION" = "0.0.0" ] || [ "$VERSION" = "dev" ]; then
            echo "::error::Refusing to release a non-release version ($VERSION) from main"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare game/BepInEx reference assemblies
        shell: bash
        env:
          GAME_MANAGED: ${{ secrets.GAME_MANAGED }}
          BEPINEX_CORE: ${{ secrets.BEPINEX_CORE }}
        run: |
          set -euo pipefail

          if [ -z "${GAME_MANAGED:-}" ] || [ -z "${BEPINEX_CORE:-}" ]; then
            echo "::error::Missing GAME_MANAGED or BEPINEX_CORE secret. Set both on the self-hosted runner."
            exit 1
          fi

          if [ ! -d "$GAME_MANAGED" ]; then
            echo "::error::GAME_MANAGED is not a directory on this runner: $GAME_MANAGED"
            exit 1
          fi

          if [ ! -d "$BEPINEX_CORE" ]; then
            echo "::error::BEPINEX_CORE is not a directory on this runner: $BEPINEX_CORE"
            exit 1
          fi

          echo "Using GAME_MANAGED=$GAME_MANAGED"
          echo "Using BEPINEX_CORE=$BEPINEX_CORE"
          echo "GAME_MANAGED=$GAME_MANAGED" >> "$GITHUB_ENV"
          echo "BEPINEX_CORE=$BEPINEX_CORE" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/HSRTimer/HSRTimer.csproj -c Release

      - name: Verify versioned DLL
        shell: bash
        run: |
          set -euo pipefail
          DLL="src/HSRTimer/bin/Release/netstandard2.0/HSRTimer-v${{ steps.version.outputs.version }}.dll"
          if [ ! -f "$DLL" ]; then
            echo "::error::Expected build output not found: $DLL"
            exit 1
          fi
          echo "Artifact: $DLL"

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          notes_file="release-notes.md"

          awk -v ver="## $VERSION" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "::error::No CHANGELOG entry found for version $VERSION"
            exit 1
          fi

          echo "Extracted release notes from CHANGELOG.md for $VERSION"

      - name: Create and push version tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping creation."
          else
            git tag -a "$TAG" -m "HSRTimer ${{ steps.version.outputs.version }}"
            git push origin "$TAG"
            echo "Pushed tag $TAG."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: HSRTimer v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            src/HSRTimer/bin/Release/netstandard2.0/HSRTimer-v${{ steps.version.outputs.version }}.dll
          fail_on_unmatched_files: true
